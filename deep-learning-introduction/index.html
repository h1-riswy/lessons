<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{--bg:#f6f7f9;--paper:#fff;--ink:#202b3c;--muted:#617084;--line:#dfe5ec;--accent:#246858;--soft:#e7f2ed}
*{box-sizing:border-box}html{scroll-padding-top:2rem}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}a{color:var(--accent);text-underline-offset:4px}a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.skip{position:absolute;top:-100px;left:1rem}.skip:focus{top:1rem;background:var(--paper);z-index:10}.layout{max-width:1540px;margin:auto;display:grid;grid-template-columns:270px minmax(0,1fr) 220px;gap:36px;padding:36px 32px}.sidebar,.contents{position:sticky;top:32px;align-self:start;max-height:calc(100vh - 64px);overflow:auto}.brand{font-size:1.35rem;font-weight:750;text-decoration:none;display:block}.eyebrow{font-size:.7rem;letter-spacing:.16em;color:var(--muted);font-weight:700}.intro{font-size:.8rem;color:var(--muted);margin:4px 0 28px}.nav-title{font-size:.75rem;color:var(--muted);letter-spacing:.1em}summary{cursor:pointer;font-weight:650}.sidebar summary{margin-bottom:12px}.chapters{display:grid;gap:5px}.chapters a{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--muted);font-size:.85rem;line-height:1.6;padding:11px 12px;border-radius:8px}.chapters a:hover{background:var(--paper)}.chapters a[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:700}.number{font:12px/1.6 ui-monospace,monospace;opacity:.7}.reading{min-width:0}.toolbar{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:.75rem;margin-bottom:18px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px 42px}.markdown{overflow-wrap:anywhere}.markdown h1{font-size:1.85rem;line-height:1.55;letter-spacing:-.025em;margin:0 0 32px}.markdown h2{font-size:1.35rem;line-height:1.6;margin:48px 0 20px;padding-bottom:12px;border-bottom:1px solid var(--line)}.markdown h3{font-size:1.08rem;margin:30px 0 12px}.markdown p,.markdown ul,.markdown ol{margin:16px 0}.markdown li{margin:5px 0}.markdown ul,.markdown ol{padding-left:1.5em}.markdown img{display:block;max-width:100%;height:auto;background:#fff;border-radius:8px;margin:24px auto}.markdown blockquote{margin:24px 0;background:var(--soft);border-left:3px solid var(--accent);padding:4px 20px;border-radius:0 8px 8px 0}.markdown pre{overflow:auto;background:var(--bg);border:1px solid var(--line);padding:20px;border-radius:8px;font-size:.8rem;line-height:1.75;overflow-wrap:normal;tab-size:4}.markdown code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.markdown :not(pre)>code{background:var(--bg);padding:2px 5px;border-radius:4px;font-size:.88em}.table-wrap{overflow:auto;margin:24px 0}.markdown table{border-collapse:collapse;min-width:100%;font-size:.88rem}.markdown th,.markdown td{border:1px solid var(--line);padding:10px 14px;text-align:left;min-width:90px}.markdown th{background:var(--bg)}.markdown hr{border:0;border-top:1px solid var(--line);margin:40px 0}.contents{font-size:.75rem;border-left:1px solid var(--line);padding-left:20px}.contents a{display:block;color:var(--muted);text-decoration:none;line-height:1.7;padding:6px 0}.contents a:hover{color:var(--accent)}.contents .sub{padding-left:12px;font-size:.7rem}.pager{display:flex;justify-content:space-between;gap:20px;margin:28px 0}.pager a{text-decoration:none;max-width:48%;font-size:.85rem}.pager a:last-child{margin-left:auto;text-align:right}.footer{font-size:.75rem;color:var(--muted);margin-top:28px}.error{color:#b33} [hidden]{display:none!important}
@media(prefers-color-scheme:dark){:root{--bg:#151c24;--paper:#1d2631;--ink:#e0e7ee;--muted:#a2b0c1;--line:#354252;--accent:#8dd5b9;--soft:#243e38}}
@media(min-width:901px){.sidebar summary{pointer-events:none;list-style:none}.sidebar summary::-webkit-details-marker{display:none}}
@media(max-width:1200px){.layout{grid-template-columns:240px minmax(0,1fr);gap:24px}.contents{display:none}}
@media(max-width:900px){.layout{display:block;padding:24px 16px}.sidebar{position:static;max-height:none;overflow:visible;margin-bottom:24px}.intro{margin-bottom:16px}.sidebar details{border-bottom:1px solid var(--line);padding-bottom:12px}.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}.paper{padding:28px 22px}.markdown h1{font-size:1.5rem}.toolbar{flex-wrap:wrap}}
@media(max-width:480px){.chapters{grid-template-columns:1fr}.paper{padding:24px 18px}.markdown{font-size:.93rem}}
@media print{.sidebar,.contents,.toolbar,.pager,.footer{display:none}.layout{display:block;padding:0}.paper{border:0;padding:0}.markdown pre{white-space:pre-wrap}.markdown img{max-height:80vh}body{background:white;color:black}}
</style>
</head>
<body>
<a class="skip" href="#article">本文へ移動</a>
<div class="layout">
<aside class="sidebar">
<div class="eyebrow">ENGINEER'S LEARNING NOTES</div>
<a class="brand" href="#0_overview.md">深層学習入門</a>
<p class="intro">仕組みを理解して、生成AI時代を読み解く。</p>
<details id="chapter-menu" open><summary>学習コンテンツ <span class="nav-title">／ 全9章</span></summary><nav class="chapters" aria-label="章一覧"></nav></details>
<p class="footer">基礎から Transformer、そして実践へ。<br>自分のペースで読み進めましょう。</p>
</aside>
<main class="reading" id="main">
<div class="toolbar"><span id="position">概要と目次</span><a id="source" href="0_overview.md">Markdown を見る ↗</a></div>
<div class="paper"><p id="status" role="status">資料を読み込んでいます…</p><article class="markdown" id="article" tabindex="-1"></article><noscript>閲覧には JavaScript を有効にしてください。</noscript></div>
<nav class="pager" aria-label="前後の章"></nav>
</main>
<aside class="contents"><div class="nav-title">このページの目次</div><nav id="toc" aria-label="ページ内目次"></nav></aside>
</div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const chapters = [
    ['0_overview.md','概要と目次'],
    ['1_what_is_deep_learning.md','深層学習とは何か'],
    ['2_neural_network_basics.md','ニューラルネットワークの基礎'],
    ['3_how_learning_works.md','学習の仕組み'],
    ['4_evaluation_and_tuning.md','学習の評価とチューニング'],
    ['5_cnn.md','CNN — 画像を扱う'],
    ['6_rnn_lstm_gru.md','RNN・LSTM・GRU'],
    ['7_attention_transformer.md','Attention と Transformer'],
    ['8_llm_and_generative_ai.md','LLM と生成 AI'],
    ['9_hands_on_and_review.md','ハンズオンと総復習']
  ];
  const article = document.getElementById('article');
  const status = document.getElementById('status');
  const menu = document.getElementById('chapter-menu');
  const toc = document.getElementById('toc');
  const pager = document.querySelector('.pager');
  const source = document.getElementById('source');
  document.querySelector('.skip').addEventListener('click', event => { event.preventDefault(); article.focus(); article.scrollIntoView(); });
  const cache = new Map();
  let current = '', request = 0;
  function link(label, href) { const a = document.createElement('a'); a.textContent = label; a.href = href; return a; }
  chapters.forEach(([file,title], i) => {
    const a = link(title, '#' + file);
    const number = document.createElement('span'); number.className = 'number'; number.textContent = String(i).padStart(2,'0');
    a.prepend(number); document.querySelector('.chapters').append(a);
  });
  const mobile = matchMedia('(max-width:900px)');
  menu.open = !mobile.matches;
  mobile.addEventListener('change', event => { menu.open = !event.matches; });
  function scrollToSection(section) {
    if (section) document.getElementById(section)?.scrollIntoView();
    else window.scrollTo(0,0);
  }
  async function render() {
    const token = ++request;
    let file, section;
    try { [file, section] = decodeURIComponent(location.hash.slice(1)).split('/'); }
    catch { file = ''; }
    file ||= chapters[0][0];
    const index = chapters.findIndex(chapter => chapter[0] === file);
    if (index < 0) { current = ''; article.replaceChildren(); toc.replaceChildren(); pager.replaceChildren(); source.hidden = true; status.hidden = false; status.textContent = '指定された章が見つかりません。章一覧から選択してください。'; return; }
    if (current === file) { scrollToSection(section); return; }
    current = '';
    status.hidden = false; status.className = ''; status.textContent = '資料を読み込んでいます…';
    article.replaceChildren(); toc.replaceChildren(); pager.replaceChildren(); source.hidden = true;
    try {
      if (!window.marked || !window.DOMPurify) throw new Error('表示ライブラリを読み込めませんでした。ネットワーク接続を確認し、再読み込みしてください。');
      let markdown = cache.get(file);
      if (markdown === undefined) {
        const response = await fetch(file);
        if (!response.ok) throw new Error(`資料を取得できませんでした（HTTP ${response.status}）。`);
        markdown = await response.text(); cache.set(file,markdown);
      }
      if (token !== request) return;
      article.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
      article.querySelectorAll('img').forEach(img => {
        img.decoding = 'async';
      });
      article.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        const target = chapters.find(([name]) => name === href.replace(/^\.\//,''));
        if (target) a.href = '#' + target[0];
      });
      article.querySelectorAll('table').forEach(table => { const wrapper = document.createElement('div'); wrapper.className = 'table-wrap'; wrapper.tabIndex = 0; table.before(wrapper); wrapper.append(table); });
      article.querySelectorAll('h2,h3').forEach((heading,i) => {
        heading.id = 'section-' + i;
        const a = link(heading.textContent, '#' + file + '/' + heading.id);
        if (heading.tagName === 'H3') a.className = 'sub'; toc.append(a);
      });
      document.querySelectorAll('.chapters a').forEach((a,i) => { if (i === index) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
      document.getElementById('position').textContent = index === 0 ? 'COURSE GUIDE ／ 概要と目次' : `CHAPTER ${String(index).padStart(2,'0')} ／ 全9章`;
      source.href = file; source.hidden = false;
      if (index > 0) pager.append(link('← ' + chapters[index-1][1], '#' + chapters[index-1][0]));
      if (index < chapters.length-1) pager.append(link(chapters[index+1][1] + ' →', '#' + chapters[index+1][0]));
      document.title = chapters[index][1] + ' | 深層学習入門';
      current = file; status.hidden = true;
      if (matchMedia('(max-width:900px)').matches) menu.open = false;
      // Wait for diagrams above the target to settle before restoring a deep link.
      await Promise.all([...article.querySelectorAll('img')].map(img => img.complete ? Promise.resolve() : new Promise(resolve => { img.addEventListener('load', resolve, {once:true}); img.addEventListener('error', resolve, {once:true}); })));
      if (token === request) scrollToSection(section);
    } catch (error) {
      if (token !== request) return;
      current = ''; status.hidden = false; status.className = 'error';
      status.textContent = location.protocol === 'file:' ? 'ローカルでの確認は HTTP サーバーを使用してください（python3 -m http.server 8000）。' : error.message;
    }
  }
  window.addEventListener('hashchange', render);
  render();
});
</script>
</body>
</html>
